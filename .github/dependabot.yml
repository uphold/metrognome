# Keeps SHA-pinned actions and npm deps current; the cooldown skips releases
# younger than 7 days, the window in which most hijacked versions get pulled.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
