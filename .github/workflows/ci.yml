# CI covers only the offline chain: self-tests, the metro-mcp reaper e2e
# (fake Metro, no device), the smoke chain, and official plugin validation.
#
# The live path (real device / MCP runtime) cannot be CI-tested because it
# requires a connected simulator or device and an active Claude Code session.

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # engines floor + current LTS
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      - name: Self-tests (stats · doctor · playbook)
        run: npm test

      - name: metro-mcp reaper e2e
        run: npm run heal:e2e

      - name: Offline smoke chain (perf_scan → build_perf_map → build_run_report)
        run: npm run smoke

      # Offline, no auth. --strict treats warnings as errors.
      - name: Official plugin validation (strict)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.226
          claude plugin validate . --strict
